version: '3.9'

services:
  web:
    build: .
    # ports:
    #   - "8000:8000"
    #   - "9000:9000"
    #   - "3000:3000"
    working_dir: /code
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    tty: true
  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - data-pg:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: gapG5XC8CiOj
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  data-pg: